<html>
<head>
<meta charset='UTF-8'/>
<meta content='width=device-width, initial-scale=1, user-scalable=1, minimum-scale=1, maximum-scale=5' name='viewport'/>
<meta content='IE=edge' http-equiv='X-UA-Compatible'/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
<script src="https://kit.fontawesome.com/4f3ce16e3e.js" crossorigin="anonymous"></script>
<title>Feliz Cumpleaños Mi Niña</title>
<style>
:root {
--warna-bg: rgba(0, 0, 0, .35); 
--warna-teks: white;
--warna-bingkai: rgba(255, 255, 255, .8);
--bingkai: 15px;
--gaya-font: 'Ubuntu', sans-serif;
--gaya-font2: 'Dancing Script', sans-serif;
}
body{background-color:#101010;font-family:var(--gaya-font);padding: 25px;-webkit-user-select: none; -ms-user-select: none; user-select: none; margin:0; overflow:hidden;} 
a{text-decoration:none;}

#bodyblur{opacity:1;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:-1;transition:all 1s ease;} 
#wallpaper{width:100%; height:100%; object-fit:cover; position:fixed; top:0; left:0; z-index:-2;}
#beneranblur{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);z-index:-1;}

#Content{position:relative;opacity:0;margin-top:15vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 1s ease;}

#suratin img{display:inline-flex;background:rgba(255,255,255, 1);border-radius:15px;padding:15px;width:110px;height:90px;transition:all .3s ease;box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor:pointer;}
#suratin img:hover{transform:scale(0.95);}
#ket{color:white;font-size:16px;font-weight:700;text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8);margin-top:20px;text-align:center;}

blockquote{opacity:0;visibility:hidden;transition:all .5s ease;width:85%;max-width:350px;background:var(--warna-bg);border-radius:var(--bingkai);border: 1px solid var(--warna-bingkai);color:var(--warna-teks);text-shadow: 0px 2px 2px rgba(0, 0, 0, .8);text-align:center;padding:25px;box-shadow: 0 8px 32px rgba(0,0,0,0.3);}
p{color:var(--warna-teks);font-size:18px;font-weight:700;line-height:1.4em;margin:0;text-shadow: 0px 2px 2px rgba(0, 0, 0, .8);}
#kalimat{font-size:20px;}
#kalimatb{font-family:var(--gaya-font2);font-size:28px;font-weight:700;margin-top:15px;color:#ffb703;}

#Tombol{position:relative;opacity:0;margin-top:25px;display:flex;align-items:center;justify-content:center;gap:15px;transform: scale(.1);transition:all 1s ease;}
#Tombol a{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:12px 30px;border:2px solid var(--warna-bingkai);border-radius:var(--bingkai);background:var(--warna-bg);color:var(--warna-teks);font-size:16px;font-weight:700;box-shadow: 0 4px 10px rgba(0,0,0,0.2);} 

#fotoakhir{display:none;opacity:0;transition:all 1.5s ease;transform: scale(.1);border-radius:15px;width:150px;height:150px;object-fit:cover;border:2px solid white;margin-bottom:15px;box-shadow: 0 4px 15px rgba(0,0,0,0.5);}

.fa-heart {opacity:.5;color:#ff4d6d;font-size: 24px;position: absolute;animation: heartMove linear 1;top: -10vh;z-index: 0;}
@keyframes heartMove {0%{transform: translateY(-10vh);} 100%{transform: translateY(110vh);}}
</style>
</head>
<body>

   <!-- Referencias apuntando a tu carpeta 'midias' en minúscula -->
   <div id="pesanstiker" style="display:none;">
		<img id="stiker1" src="./midias/figu8.gif"/>
		<img id="stiker2" src="./midias/figu2.gif"/>
		<img id="stiker3" src="./midias/figu1.gif"/>
		<img id="stiker4" src="./midias/figu4.gif"/>
		<img id="stiker5" src="./midias/figu5.gif"/>
		<img id="stiker6" src="./midias/teste.gif"/>
   </div>

   <img src="./midias/fundo1.jpg" id="wallpaper"/>
   <div id="bodyblur"></div>
   <div id="beneranblur"></div>

   <div id='Content'>
      <div id="suratin" onClick="memulai()">
         <img src="./midias/envelope.png"/>
      </div>
      <p id="ket">Toca el sobre para abrir tu regalo 💌</p>
   
      <div><img src="./midias/gato.jpg" id="fotoakhir"/></div>
      
      <div><blockquote id='bq'>
         <p id="kalimat"></p>
         <p id="kalimatb"></p>
      </blockquote></div>
   
      <div id="Tombol">
         <a id="By" onClick="conververdade()">SÍ</a>
         <a id="Bn" onClick="tolak()">NO</a>
      </div>
   </div>

<script>
  const swalst = Swal.mixin({timer: 2500, allowOutsideClick: false, showConfirmButton: false, timerProgressBar: true, imageWidth: 100, imageHeight: 100});

  function showDiv() { document.getElementById('Content').style.opacity = "1"; }
  setTimeout(showDiv, 100);

  async function pesan(){
      await swalst.fire({
          title: '¡Hola mi pequeña ❤️!',
          imageUrl: '' + stiker1.src,
      });
      await swalst.fire({
          title: '¿Cómo estás mi amor? 🥳',
          imageUrl: '' + stiker2.src,
      });
      await swalst.fire({
          title: 'Mi vida cambió cuando te conocí ❤️',
          imageUrl: '' + stiker6.src,
      });
      await swalst.fire({
          title: '¿Sabías que te amo muchísimo? 🤭',
          imageUrl: '' + stiker3.src,
      });
      await swalst.fire({
          title: 'De verdad, te amo desde hace mucho tiempo 👉🏻👈🏻',
          imageUrl: '' + stiker4.src,
      });
      await swalst.fire({
          title: 'Amo estar a tu lado ❤️',
          imageUrl: '' + stiker5.src,
      });
      
      kpemb();
  }

  function memulai(){
      suratin.style.transition = "all 1s ease";
      suratin.style.transform = "scale(.1)";
      suratin.style.opacity = "0";
      ket.style.transition = "all 1s ease";
      ket.style.transform = "scale(.1)";
      ket.style.opacity = "0";
      setTimeout(pesan, 400);
  }
  
  function kpemb() {
      suratin.style.display = "none";
      ket.style.display = "none";
      bq.style.opacity = "1";
      bq.style.visibility = "visible";
      katangetik = "¿Eres mi niña?";
      ngetik();
      setTimeout(mostrarBotones, 1200);
  }

  function mostrarBotones(){
      Tombol.style.marginTop = "25px";
      Tombol.style.opacity = "1";
      Tombol.style.transform = "scale(1)";
  } 
  
  var aa=0, katangetik;
  function ngetik() {
      if(aa < katangetik.length){
          kalimat.innerHTML += katangetik.charAt(aa);
          aa++;
          setTimeout(ngetik, 100);
      }
  }

  function tolak(){
      kalimat.style.display = "none";
      Tombol.style.display = "none";
      fotoakhir.style.display = "inline-flex";
      setTimeout(() => {
          fotoakhir.style.opacity = "1";
          fotoakhir.style.transform = "scale(1)";
      }, 50);
      kalimat.innerHTML = "¡Ah, te equivocaste de botón! 😢";
      kalimat.style.display = "block";
  }

  function conververdade(){
      Tombol.style.display = "none";
      kalimat.innerHTML = "Feliz cumple mi niña";
      kalimatb.innerHTML = "te amo mucho 🧡";
      setInterval(createHeart, 200);
  }
</script>

<script>
const body = document.querySelector("body");
function createHeart() {
    const heart = document.createElement("div"); 
    heart.className = "fas fa-heart"; 
    heart.style.left = (Math.random() * 95) + "vw"; 
    heart.style.animationDuration = (Math.random() * 3) + 2 + "s"; 
    body.appendChild(heart);
} 
setInterval(function() {
    var heartArr = document.querySelectorAll(".fa-heart"); 
    if (heartArr.length > 100) { heartArr[0].remove(); }
}, 100);
</script>
</body>
</html>
